<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>DraveKaraoke speler</title>
<style>
html,body{margin:0;height:100%;background:#0d0b14;color:#f0f0f5;font-family:"Segoe UI",Arial,sans-serif;overflow:hidden}
#video{position:absolute;left:0;top:0;right:0;bottom:170px;background:#000}
#video iframe{width:100%;height:100%;border:0}
#tekst{position:absolute;left:0;right:0;bottom:0;height:170px;background:#16131f;border-top:3px solid #4a3d66;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 30px;box-sizing:border-box}
#nu{font-size:52px;font-weight:700;line-height:1.15}
#straks{font-size:30px;color:#9a93b8;margin-top:8px}
#rust{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#16131f;text-align:center}
#rust h1{font-size:64px;color:#b59cff;margin:0 0 20px}
#rust p{font-size:32px;color:#d0d0e0;margin:6px}
#melding{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#7a3a20;border:3px solid #ffa070;border-radius:14px;
  padding:14px 26px;font-size:26px;display:none;max-width:80%}
#wie{position:absolute;top:16px;left:20px;background:rgba(22,19,31,.85);border:2px solid #4a3d66;border-radius:12px;padding:8px 16px;font-size:24px}
</style></head><body>
<div id="video"><div id="yt"></div></div>
<div id="tekst"><div id="nu"></div><div id="straks"></div></div>
<div id="wie" style="display:none"></div>
<div id="rust"><h1>🎤 DraveKaraoke</h1><p>Kies een liedje op je mobiel.</p><p>Scan de code rechts met je camera.</p></div>
<div id="melding"></div>
<script>
const KLEUR = ["#b59cff", "#5ee0c8"], SAMEN = "#ffdc5a";
let speler = null, klaar = false, nuId = null, tekst = null, namen = [], stand = null, standT = 0;
function api(p, d){ return fetch(p, d ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(d)} : {}).then(r=>r.json()); }
const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
function onYouTubeIframeAPIReady(){
  speler = new YT.Player("yt", {width:"100%", height:"100%", playerVars:{autoplay:1, rel:0, modestbranding:1, playsinline:1, origin:location.origin},
    events:{onReady:()=>{klaar=true;}, onStateChange:e=>{ if(e.data===0) api("/api/speler",{tijd:0,speelt:false,eind:true}); },
            onError:e=>{ api("/api/speler",{tijd:0,speelt:false,fout:e.data}); }}});
}
function doe(o){
  if(!klaar) return;
  if(o.actie==="laad"){ nuId=o.id; tekst=null; vorigeT=-1; nuDuur=(stand&&stand.nu&&stand.nu.id===o.id&&stand.nu.duur)||0; speler.loadVideoById(o.id); document.getElementById("rust").style.display="none"; }
  else if(o.actie==="stop"){ speler.stopVideo(); nuId=null; document.getElementById("rust").style.display="flex"; }
  else if(o.actie==="pauze") speler.pauseVideo();
  else if(o.actie==="verder") speler.playVideo();
  else if(o.actie==="opnieuw") speler.seekTo(0, true);
  else if(o.actie==="volume") speler.setVolume(o.waarde);
}
setInterval(()=>{ api("/api/speler").then(d=>{
  if(d.nu && d.nu.insluiten===false){                     // 0.2: dit liedje mag alleen op YouTube zelf
    if(nuId){ try{speler.stopVideo();}catch(e){} nuId=null; }
    if(GEWOON) ytTab(d.nu); else melding2(d.nu.id);
    return; }
  ytTab(null); melding2(null);
  (d.opdrachten||[]).forEach(doe);
  if(klaar && d.nu && d.nu.id!==nuId){ doe({actie:"laad", id:d.nu.id}); } }).catch(()=>{}); }, 400);
let elders=null;
function melding2(id){ if(id===elders) return; elders=id; const r=document.getElementById("rust");
  if(id){ r.style.display="flex"; r.innerHTML="<h1>🎤 DraveKaraoke</h1><p>Dit liedje mag alleen op YouTube zelf.</p><p>Het speelt in het DraveKaraoke-venster.</p>"; }
  else { r.innerHTML=RUST; if(nuId) r.style.display="none"; } }
const RUST=document.getElementById("rust").innerHTML;
const GEWOON = !/QtWebEngine/.test(navigator.userAgent);   // in je eigen browser (niet in het DraveKaraoke-venster)
// 0.2: "alleen YouTube"-liedjes openen in één vast YouTube-tabblad (met je eigen account = geen reclame).
// De tekst loopt op een klok vanaf het openen. Na het liedje (of bij ⏭) gaat het tabblad weer dicht.
let tab=null, tabId=null, tabStart=0, tabDuur=0;
function ytTab(nu){
  if(!nu){ if(tabId){ try{ if(tab&&!tab.closed) tab.close(); }catch(e){} tab=null; tabId=null; knopWeg(); } return; }
  if(tabId!==nu.id){
    try{ if(tab&&!tab.closed) tab.close(); }catch(e){}
    tabId=nu.id; tabDuur=nu.duur||0; tabStart=0;
    tab=window.open("https://www.youtube.com/watch?v="+nu.id, "drave_yt");
    if(tab){ tabStart=performance.now()+2500; knopWeg(); melding3(); } else knopToon(nu);   // pop-up geblokkeerd: dan een knop
    return; }
  if(!tab||!tabStart) return;
  if(tab.closed){ tab=null; api("/api/speler",{tijd:0,speelt:false,eind:true}); return; }   // zelf dichtgedaan = volgende
  const t=Math.max(0,(performance.now()-tabStart)/1000);
  if(tabDuur>0 && t>tabDuur+2){ try{tab.close();}catch(e){} tab=null; api("/api/speler",{tijd:t,speelt:false,eind:true}); return; }
  api("/api/speler",{tijd:t, speelt:t>0}).catch(()=>{});
}
function melding3(){ const r=document.getElementById("rust"); r.style.display="flex";
  r.innerHTML="<h1>🎤 DraveKaraoke</h1><p>Dit liedje speelt in het YouTube-tabblad.</p><p>Het tabblad gaat na het liedje vanzelf dicht.</p>"; elders="tab"; }
function knopToon(nu){ const r=document.getElementById("rust"); r.style.display="flex"; elders="tab";
  r.innerHTML="<h1>🎤 DraveKaraoke</h1><p>Je browser hield het YouTube-tabblad tegen.</p>"+
   "<p style='font-size:24px;color:#9a93b8'>Tip: klik rechts in de adresbalk op het pop-up-icoontje en kies <b>Altijd toestaan</b>.</p>"+
   "<button id='ytknop' style='margin-top:20px;font-size:36px;font-weight:700;padding:20px 40px;border-radius:20px;border:4px solid #5ee0c8;background:#221d33;color:#fff;cursor:pointer'>▶ Open dit liedje op YouTube</button>";
  document.getElementById("ytknop").onclick=()=>{ tab=window.open("https://www.youtube.com/watch?v="+nu.id,"drave_yt"); if(tab){ tabStart=performance.now()+2500; melding3(); } }; }
function knopWeg(){ if(elders==="tab"){ elders=null; const r=document.getElementById("rust"); r.innerHTML=RUST; if(nuId) r.style.display="none"; } }
// in een gewone browser mag geluid pas na één klik
if(!/QtWebEngine/.test(navigator.userAgent)){ const k=document.createElement("div");
  k.style.cssText="position:fixed;inset:0;background:rgba(13,11,20,.92);display:flex;align-items:center;justify-content:center;z-index:99;cursor:pointer";
  k.innerHTML="<div style='font-size:46px;font-weight:700;border:4px solid #b59cff;border-radius:24px;padding:30px 50px;color:#fff'>▶ Klik hier om te starten<div style='font-size:24px;color:#9a93b8;margin-top:10px;text-align:center'>Druk daarna op F11 voor groot scherm</div></div>";
  k.onclick=()=>{ k.remove(); try{ if(speler&&nuId) speler.playVideo(); }catch(e){} }; document.body.appendChild(k); }
// 0.2: tijdens reclame loopt de tekst niet. Alleen "speelt" als de tijd van het liedje echt vooruit gaat
// en de lengte klopt met het liedje (een reclame heeft een andere lengte).
let vorigeT=-1, nuDuur=0;
setInterval(()=>{ if(!klaar||!nuId) return; const s=speler.getPlayerState(), t=speler.getCurrentTime()||0, d=speler.getDuration()||0;
  const reclame = nuDuur>0 && d>0 && Math.abs(d-nuDuur)>4;
  const loopt = s===1 && t>vorigeT+0.05 && !reclame;
  if(!reclame) vorigeT=t;
  api("/api/speler",{tijd:reclame?0:t, speelt:loopt}).catch(()=>{}); }, 600);
setInterval(()=>{ api("/api/stand").then(d=>{ stand=d; standT=performance.now(); namen=d.namen||[];
  const m=document.getElementById("melding"); m.textContent=d.melding||""; m.style.display=d.melding?"block":"none";
  const w=document.getElementById("wie");
  if(d.nu && d.nu.id===nuId && d.nu.duur) nuDuur=d.nu.duur;
  if(d.nu){ w.style.display="block"; w.textContent="🎤 "+d.nu.wie+": "+d.nu.titel; } else w.style.display="none";
  if(d.nu && d.nu.tekst_klaar && (!tekst || tekst.id!==d.nu.id)) api("/api/tekst?id="+d.nu.id).then(t=>{ t.id=d.nu.id; tekst=t; });
  if(d.nu && tekst && tekst.id===d.nu.id) tekst.offset=d.nu.offset; }).catch(()=>{}); }, 700);
function kleurVan(i){ if(!tekst||!tekst.duet) return "#ffffff"; const k=tekst.duet[String(i)];
  if(k==="samen") return SAMEN; const n=namen.indexOf(k); return n>=0 ? KLEUR[n%2] : "#ffffff"; }
function teken(){
  const nu=document.getElementById("nu"), st=document.getElementById("straks");
  if(stand&&stand.modus==="muziek"){ nu.textContent=stand.nu?"🎵 "+stand.nu.titel:"🎵"; nu.style.color="#ffffff"; st.textContent="Muziek-modus"; return requestAnimationFrame(teken); }
  if(!stand||!stand.nu||!tekst||!tekst.regels||!tekst.regels.length){ nu.textContent=stand&&stand.nu?(tekst&&tekst.klaar?"♪ (geen songtekst gevonden)":"♪"):""; st.textContent=""; return requestAnimationFrame(teken); }
  let t = stand.tijd + (stand.speelt ? (performance.now()-standT)/1000 : 0) + (tekst.offset||0);
  const r=tekst.regels; let i=-1;
  if(tekst.meelopend){ for(let k=0;k<r.length;k++){ if(r[k][0]<=t) i=k; else break; } }
  else i=0;
  const a = i>=0 ? r[i][1] : "♪", b = (i+1<r.length) ? r[i+1][1] : "";
  nu.textContent=a||"♪"; nu.style.color=i>=0?kleurVan(i):"#ffffff"; st.textContent=b;
  requestAnimationFrame(teken);
}
requestAnimationFrame(teken);
</script></body></html>
